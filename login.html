<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1e2">
<title>Travel Desk — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f1e2'/%3E%3Cpath d='M20 42 L32 22 L44 42' stroke='%237f5e05' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:#f6f1e2;color:#4a4331;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){body{background:#0a0a0a;color:#d8d3c2}}
  .card{width:100%;max-width:340px;
    background:linear-gradient(180deg,#fffdf4,#f5eeda);color:#251e0d;
    border:1px solid #dcd2b6;border-radius:16px;
    padding:30px 28px;box-shadow:0 6px 24px rgba(90,74,30,.10)}
  @media (prefers-color-scheme: dark){
    .card{background:linear-gradient(180deg,#1d1a12,#272214);color:#f2f0e6;border-color:#4d4227}
  }
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
    color:#7f5e05;margin-bottom:10px}
  @media (prefers-color-scheme: dark){.eyebrow{color:#f5c518}}
  .brand{font-size:22px;font-weight:900;letter-spacing:-.4px;color:#251e0d}
  @media (prefers-color-scheme: dark){.brand{color:#f2f0e6}}
  .sub{font-size:13.5px;color:#6b6149;margin:8px 0 20px;line-height:1.5}
  @media (prefers-color-scheme: dark){.sub{color:#928a72}}
  input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:9px;
    border:1px solid #dcd2b6;background:#ede5cf;color:#251e0d;margin-bottom:12px}
  @media (prefers-color-scheme: dark){
    input{background:#14110a;border-color:#4d4227;color:#f2f0e6}
  }
  input:focus{outline:2px solid #7f5e05;outline-offset:1px;border-color:#7f5e05}
  .pw-wrap{position:relative;margin-bottom:12px}
  .pw-wrap input{margin-bottom:0;padding-right:66px}
  .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:auto;
    background:none;border:0;color:#6b6149;font-size:13px;font-weight:700;padding:9px 10px;cursor:pointer}
  .pw-toggle:hover{color:#251e0d}
  button{width:100%;font:inherit;font-size:15px;font-weight:900;padding:12px;border:0;
    border-radius:12px;background:linear-gradient(180deg,#ffd84a,#b8860b);background-origin:border-box;
    color:#251e0d;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.04)}
  button:disabled{opacity:.55;cursor:wait}
  .err{font-size:13px;color:#c22f22;margin:12px 0 0;min-height:1.2em;font-weight:600}
  @media (prefers-color-scheme: dark){.err{color:#ff4d4d}}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Travel Desk</div>
  <div class="brand">Travel Desk</div>
  <p class="sub" id="blurb">Enter the password to open the travel board.</p>
  <form id="f" autocomplete="off">
    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" minlength="8" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
    </div>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p class="err" id="err"></p>
</div>
<script>
(function(){
  var blurb=document.getElementById('blurb'), form=document.getElementById('f'),
      pw=document.getElementById('pw'), go=document.getElementById('go'),
      err=document.getElementById('err'), toggle=document.getElementById('pw-toggle'),
      needsSetup=false,
      setupToken=new URLSearchParams(location.search).get('setup')||'';

  toggle.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    toggle.textContent=show?'Hide':'Show';
    toggle.setAttribute('aria-label',show?'Hide password':'Show password');
    pw.focus();
  });

  fetch('/api/setup',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){
      needsSetup=!!j.needs_setup;
      if(needsSetup && j.token_required && !setupToken){
        blurb.textContent='First run — open the setup link (/login?setup=…) to choose the password.';
        go.disabled=true;
      } else if(needsSetup){
        blurb.textContent='First run — choose a password (8+ characters). Nobody else ever sees it.';
        pw.setAttribute('autocomplete','new-password');
        pw.setAttribute('placeholder','Choose a password');
        go.textContent='Set password';
      }
    }).catch(function(){});

  function fail(msg){ err.textContent=msg; go.disabled=false; go.textContent=needsSetup?'Set password':'Unlock'; }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.textContent='';
    go.disabled=true; go.textContent='…';
    var body=JSON.stringify({password:pw.value});
    var headers={'content-type':'application/json'};
    function doLogin(){
      return fetch('/api/login',{method:'POST',headers:headers,body:body,cache:'no-store'});
    }
    var first=needsSetup
      ? fetch('/api/setup',{method:'POST',headers:Object.assign({'x-setup-token':setupToken},headers),body:body,cache:'no-store'}).then(function(r){
          if(!r.ok) throw new Error('setup');
          return doLogin();
        })
      : doLogin();
    first.then(function(r){
      if(r.ok){ location.href='/'; return; }
      if(needsSetup) fail('That didn\u2019t take — use 8+ characters.');
      else fail('Wrong password — try again.');
    }).catch(function(){ fail('Couldn\u2019t reach the server. Check your connection.'); });
  });
})();
</script>
</body>
</html>
